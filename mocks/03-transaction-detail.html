<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction Detail</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div class="nav-bar">
      <a class="nav-link" href="02-transaction-list.html">‹ Back</a>
      <h1 style="font-size:17px;">Transaction</h1>
      <span style="width:44px;"></span>
    </div>
    <div class="screen">
      <div class="content">

        <div class="card" style="align-items:center;text-align:center;gap:6px;">
          <div class="avatar" style="width:56px;height:56px;background:var(--bad-bg);color:var(--bad);font-size:18px;">SC</div>
          <div class="tx-name" style="font-size:18px;">ScamyLoans GmbH</div>
          <div class="tx-amount" style="font-size:22px;">−€49.00</div>
          <div class="tx-date">Direct debit · Aug 3, 2026 · 18:02</div>
        </div>

        <div class="card">
          <div class="tx-info"><div class="tx-date">Debitor IBAN</div><div class="tx-name" style="font-size:14px;">DE12 3456 7890 0000 1234 00</div></div>
          <div class="divider"></div>
          <div class="tx-info"><div class="tx-date">Reference</div><div class="tx-name" style="font-size:14px;">Invoice #99213 loan installment</div></div>
        </div>

        <!--
          Display-only: this screen shows the transaction and the debitor's
          current status, but does not edit either. Classification (Trusted/
          Bad) and alert-threshold editing both live on the Edit Rule screen
          (04b-debitor-edit.html) now — reached via "Manage this debitor"
          below — so there is exactly one place that owns that state.
        -->
        <a class="card" href="04b-debitor-edit.html" style="flex-direction:row;align-items:center;justify-content:space-between;text-decoration:none;">
          <div class="tx-info">
            <div class="tx-date">Debitor status</div>
            <div class="tx-name" style="font-size:15px;">ScamyLoans GmbH</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="pill pill-bad">Bad</span>
            <span style="color:var(--text-muted);">Manage ›</span>
          </div>
        </a>

        <div style="flex:1"></div>
      </div>
    </div>
  </div>
</body>
</html>
