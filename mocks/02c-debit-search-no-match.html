<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Debits — No Search Match</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div class="nav-bar"><h1>Debits</h1><span></span></div>

    <!--
      R23 — the typed state of the pinned search field. The ✕ appears only
      once there is text; tapping it clears the query and hands back the full
      list (02-debit-list.html). It is a line-style SVG like the tab-bar
      icons, not an emoji or an icon font, and there is no magnifier glyph:
      the placeholder already says what the box is for.
    -->
    <div class="search-field">
      <span class="search-text">aldi</span>
      <a class="search-clear" href="02-debit-list.html" aria-label="Clear search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></a>
    </div>

    <div class="screen">

      <!--
        R23 — a search that matches nothing has to say so, and name the query.
        An empty body on its own reads as "no debits", which is the same
        picture a dead bank connection paints (R19 exists for that reason) —
        and here it would be a lie, since the list is full, just filtered.

        Deliberately nothing else: no button, no illustration. The field above
        already holds the only two ways out (edit the query, or tap the ✕).
      -->
      <div class="content" style="align-items:center;justify-content:center;text-align:center;">
        <p class="empty-note">No debits match “aldi”.</p>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item active" aria-label="Debits" href="02-debit-list.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></a>
      <a class="tab-item" aria-label="Rules" href="04-payee-rules.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg></a>
      <a class="tab-item" aria-label="Settings" href="06-settings.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4"/><path d="M18.6 12h2M16.7 16.7l1.4 1.4M12 18.6v2M7.3 16.7l-1.4 1.4M5.4 12h-2M7.3 7.3L5.9 5.9M12 5.4v-2M16.7 7.3l1.4-1.4"/></svg></a>
    </div>
  </div>
</body>
</html>
