<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div class="nav-bar"><h1>Settings</h1><span></span></div>
    <div class="screen">
      <div class="content">

        <div class="section-label">Connected banks</div>
        <div class="card" style="gap:10px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="bank-logo">N26</div>
            <div class="tx-info" style="flex:1;">
              <div class="tx-name">N26</div>
              <div class="tx-date">Connected · access renews in 64 days</div>
            </div>
            <span class="pill pill-good">Active</span>
          </div>
          <div class="divider"></div>
          <a class="nav-link" href="01d-connection-expired.html" style="font-size:14px;">Renew access early</a>
          <a class="nav-link" href="06b-disconnect-confirm.html" style="font-size:14px;color:var(--bad);">Disconnect N26</a>
        </div>

        <div class="section-label">Notifications</div>
        <div class="card" style="gap:0;">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0;">
            <div class="tx-info"><div class="tx-name" style="font-size:15px;">Push notifications</div></div>
            <span class="pill pill-good">On</span>
          </div>
          <div class="divider"></div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0;">
            <div class="tx-info">
              <div class="tx-name" style="font-size:15px;">Group multiple alerts</div>
              <div class="tx-date">Bundle several charges from bad debitors within a few minutes into one notification</div>
            </div>
            <span class="pill pill-neutral">Off</span>
          </div>
        </div>

        <a class="btn btn-outline" href="06c-delete-confirm.html" style="color:var(--bad);border-color:var(--bad);margin-top:8px;">Delete account &amp; data</a>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item" aria-label="Transactions" href="02-transaction-list.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></a>
      <a class="tab-item" aria-label="Rules" href="04-debitor-rules.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg></a>
      <a class="tab-item active" aria-label="Settings" href="06-settings.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4"/><path d="M18.6 12h2M16.7 16.7l1.4 1.4M12 18.6v2M7.3 16.7l-1.4 1.4M5.4 12h-2M7.3 7.3L5.9 5.9M12 5.4v-2M16.7 7.3l1.4-1.4"/></svg></a>
    </div>
  </div>
</body>
</html>
