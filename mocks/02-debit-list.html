<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Debits</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div class="nav-bar"><h1>Debits</h1><span></span></div>
    <div class="screen">
      <div class="content">

        <!--
          R9: every debit is shown as good or bad. Bad debits get a red amount
          and a "Bad" pill; good debits stay plain, so the list reads as an
          alarm rather than a ledger.

          The avatar colour is the PAYEE's status, the pill is THIS debit's —
          they are not the same thing. REWE below is the case that makes the
          model visible: a good payee (green avatar) with a 30,00 € limit, whose
          34,21 € charge is bad anyway (R5, last row).

          No minus signs: every debit is money going out (R2a), so "−" carries
          no information here.
        -->

        <div class="section-label">Today</div>

        <a class="tx-row" href="03-debit-detail.html">
          <div class="avatar" style="background:var(--bad-bg);color:var(--bad);">SP</div>
          <div class="tx-info">
            <div class="tx-name">Spotify AB</div>
            <div class="tx-date">Subscription · 09:14</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount" style="color:var(--bad);">€9.99</div>
            <span class="pill pill-bad">Bad</span>
          </div>
        </a>

        <div class="section-label">Yesterday</div>

        <a class="tx-row" href="03-debit-detail.html">
          <div class="avatar" style="background:var(--bad-bg);color:var(--bad);">SC</div>
          <div class="tx-info">
            <div class="tx-name">ScamyLoans GmbH</div>
            <div class="tx-date">Direct debit · 18:02</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount" style="color:var(--bad);">€49.00</div>
            <span class="pill pill-bad">Bad</span>
          </div>
        </a>

        <a class="tx-row" href="03-debit-detail.html">
          <div class="avatar" style="background:var(--good-bg);color:var(--good);">RE</div>
          <div class="tx-info">
            <div class="tx-name">REWE Markt</div>
            <div class="tx-date">Card payment · 12:41</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount" style="color:var(--bad);">€34.21</div>
            <span class="pill pill-bad">Bad</span>
          </div>
        </a>

        <div class="section-label">Aug 2</div>

        <a class="tx-row" href="03-debit-detail.html">
          <div class="avatar" style="background:var(--bad-bg);color:var(--bad);">VF</div>
          <div class="tx-info">
            <div class="tx-name">Vodafone GmbH</div>
            <div class="tx-date">Direct debit · 07:30</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount" style="color:var(--bad);">€24.99</div>
            <span class="pill pill-bad">Bad</span>
          </div>
        </a>

        <a class="tx-row" href="03-debit-detail.html">
          <div class="avatar" style="background:var(--good-bg);color:var(--good);">LL</div>
          <div class="tx-info">
            <div class="tx-name">Landlord J. Meyer</div>
            <div class="tx-date">Bank transfer · 06:00</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount">€850.00</div>
          </div>
        </a>

      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item active" aria-label="Debits" href="02-debit-list.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></a>
      <a class="tab-item" aria-label="Rules" href="04-payee-rules.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg></a>
      <a class="tab-item" aria-label="Settings" href="06-settings.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4"/><path d="M18.6 12h2M16.7 16.7l1.4 1.4M12 18.6v2M7.3 16.7l-1.4 1.4M5.4 12h-2M7.3 7.3L5.9 5.9M12 5.4v-2M16.7 7.3l1.4-1.4"/></svg></a>
    </div>
  </div>
</body>
</html>
