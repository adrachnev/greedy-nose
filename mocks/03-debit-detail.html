<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Debit Detail</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div class="nav-bar">
      <a class="nav-link" href="02-debit-list.html">‹ Back</a>
      <h1 style="font-size:17px;">Debit</h1>
      <span style="width:44px;"></span>
    </div>
    <div class="screen">
      <div class="content">

        <div class="card" style="align-items:center;text-align:center;gap:6px;">
          <div class="avatar" style="width:56px;height:56px;background:var(--bad-bg);color:var(--bad);font-size:18px;">SC</div>
          <div class="tx-name" style="font-size:18px;">ScamyLoans GmbH</div>
          <div class="tx-amount" style="font-size:22px;color:var(--bad);">€49.00</div>
          <div class="tx-date">Direct debit · Aug 3, 2026 · 18:02</div>
        </div>

        <!--
          The verdict is about THIS charge, and it always says why (R5). The
          three possible reasons match the notification bodies in R12a:
            no rule       → "You haven't reviewed this payee yet."
            payee is bad  → "You marked this payee as bad."   ← shown here
            over the limit→ "Over your limit of €30.00."
          The third one is the case where the payee is good and the verdict is
          still Bad — drawn in 03b-debit-detail-over-limit.html.
        -->
        <div class="card" style="gap:6px;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div class="tx-date">This debit</div>
            <span class="pill pill-bad">Bad</span>
          </div>
          <div class="tx-name" style="font-size:15px;">You marked this payee as bad.</div>
        </div>

        <div class="card">
          <div class="tx-info"><div class="tx-date">Payee IBAN</div><div class="tx-name" style="font-size:14px;">DE12 3456 7890 0000 1234 00</div></div>
          <div class="divider"></div>
          <div class="tx-info"><div class="tx-date">Reference</div><div class="tx-name" style="font-size:14px;">Invoice #99213 loan installment</div></div>
        </div>

        <!--
          Display-only (unchanged decision): this screen shows the charge and
          the payee's current status, but edits neither. Good/bad and the
          amount limit both live on the Edit Rule screen, reached below, so
          exactly one screen owns that state.
        -->
        <a class="card" href="04d-payee-edit-bad.html" style="flex-direction:row;align-items:center;justify-content:space-between;text-decoration:none;">
          <div class="tx-info">
            <div class="tx-date">Payee status</div>
            <div class="tx-name" style="font-size:15px;">ScamyLoans GmbH</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="pill pill-bad">Bad</span>
            <span style="color:var(--text-muted);">Manage ›</span>
          </div>
        </a>

        <div style="flex:1"></div>
      </div>
    </div>
  </div>
</body>
</html>
