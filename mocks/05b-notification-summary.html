<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notification — Reconnect Summary</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding-top:120px;color:#1c1c1e;">
      <div style="font-size:70px;font-weight:200;">9:41</div>
      <div style="font-size:18px;color:#48484a;">Monday, August 25</div>
    </div>

    <!--
      R20 — the one deliberate exception to "one notification per bad debit".

      After reconnecting, every charge from the gap carries a transaction ID
      the app has never seen, so R10b would fire one push per bad charge, all
      arriving in the same second. A single summary replaces that burst; normal
      per-charge alerts resume immediately afterwards.
    -->
    <div class="notif-banner">
      <div class="notif-icon">G</div>
      <div class="notif-text">
        <div class="notif-title">12 new debits while you were disconnected</div>
        <div class="notif-body">3 of them are bad. Tap to review them.</div>
      </div>
      <div class="notif-time">now</div>
    </div>
  </div>

  <p style="position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:#8e8e93;">Sent once, right after the first sync following a reconnect. Tapping it opens the debit list.</p>
</body>
</html>
