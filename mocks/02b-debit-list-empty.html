<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Debits — Empty</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div class="nav-bar"><h1>Debits</h1><span></span></div>

    <!--
      R23 — the pinned search field is deliberately ABSENT here, and its
      absence is the decision, not an oversight: there is nothing to search
      yet. Offering the box over an empty list hands the user a control that
      cannot change anything, and a search returning nothing from nothing is
      the one message that would confuse rather than explain.

      It is present on 01d-connection-expired.html, which looks similar but is
      not the same case — that list has history, it just has no live feed.
    -->

    <div class="screen">
      <div class="content" style="align-items:center;justify-content:center;text-align:center;">
        <span id="no-bank"></span>
        <!--
          R25 — a bank only exists once its onboarding is finished, so this "connected, nothing yet" state is a saved bank
          with no debits in the last 90 days. If that bank is expired, the R19 banner (01d) shows above this text.
        -->
        <div class="state-main" style="align-items:center;gap:8px;">
          <div class="tx-name" style="font-size:16px;">No debits yet</div>
          <p class="empty-note">Your bank account is connected. New debits will show up here as soon as they happen.</p>
        </div>
        <!-- 02b-debit-list-empty.html#no-bank (R36): the same list with no bank connected. It says where to connect. -->
        <div class="state-alt" style="align-items:center;gap:8px;width:100%;">
          <div class="tx-name" style="font-size:16px;">No bank connected</div>
          <p class="empty-note">Debits show up here once a bank is connected.</p>
          <a class="btn btn-primary" href="06-settings.html#no-bank" style="width:100%;">Connect a bank</a>
        </div>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item active" aria-label="Debits" href="02-debit-list.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></a>
      <a class="tab-item" aria-label="Rules" href="04-payee-rules.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg></a>
      <a class="tab-item" aria-label="Settings" href="06-settings.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4"/><path d="M18.6 12h2M16.7 16.7l1.4 1.4M12 18.6v2M7.3 16.7l-1.4 1.4M5.4 12h-2M7.3 7.3L5.9 5.9M12 5.4v-2M16.7 7.3l1.4-1.4"/></svg></a>
    </div>
  </div>
</body>
</html>
