<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Payee Rule — Bad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div class="nav-bar">
      <a class="nav-link" href="04-payee-rules.html">‹ Rules</a>
      <h1 style="font-size:17px;">Edit Rule</h1>
      <span style="width:44px;"></span>
    </div>
    <div class="screen">
      <div class="content">

        <div class="card" style="align-items:center;text-align:center;gap:6px;">
          <div class="avatar" style="width:56px;height:56px;background:var(--bad-bg);color:var(--bad);font-size:18px;">SC</div>
          <div class="tx-name" style="font-size:18px;">ScamyLoans GmbH</div>
        </div>

        <!--
          Bad state — the counterpart of 04b-payee-edit.html.

          The alert-limit field is gone entirely rather than disabled (R14): a
          bad payee alerts on every charge whatever the amount says (R5), so a
          greyed-out field would only invite the user to fight a control that
          does nothing. If they set a limit earlier, it is kept and comes back
          the moment they switch to Good again (R8a).

          There is no delete here either (R13): removing a rule would land the
          payee back at "no rule", which is bad — exactly where the Bad toggle
          already puts them.
        -->
        <div class="toggle-row">
          <div class="toggle-btn">Good</div>
          <div class="toggle-btn bad-active">Bad</div>
        </div>

        <p class="hint">Every charge from this payee alerts you, whatever the amount. Alert limits only apply to good payees — mark this one Good to set one.</p>

        <div style="flex:1"></div>
        <a class="btn btn-primary" href="04-payee-rules.html">Save</a>
      </div>
    </div>
  </div>
</body>
</html>
