<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notification</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding-top:120px;color:#1c1c1e;">
      <div style="font-size:70px;font-weight:200;">9:41</div>
      <div style="font-size:18px;color:#48484a;">Monday, August 4</div>
    </div>

    <div class="notif-banner">
      <div class="notif-icon">G</div>
      <div class="notif-text">
        <div class="notif-title">Greedy Nose</div>
        <div class="notif-body">New charge of −€49.00 from <strong>ScamyLoans GmbH</strong>, a debitor you marked as bad.</div>
      </div>
      <div class="notif-time">now</div>
    </div>
  </div>

  <p style="position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:#8e8e93;">Tapping the notification opens the transaction detail, where you can mark the debitor Trusted or Bad.</p>
</body>
</html>
