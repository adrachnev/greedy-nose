<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Debits — Search Results</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>••• 5G 🔋</span></div>
    <div class="nav-bar"><h1>Debits</h1><span></span></div>

    <!--
      R23a — the query is spelled with the umlaut here, but it is the spelling
      the user is allowed to NOT type: "muller" and "mueller" have to return
      this exact screen. The bank's own text for this payee is
      "BAECKEREI MUELLER 4711" (see 03b), so the app is folding umlauts in both
      directions — query and data — not just lowercasing.
    -->
    <div class="search-field">
      <span class="search-text">müller</span>
      <a class="search-clear" href="02-debit-list.html" aria-label="Clear search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></a>
    </div>

    <div class="screen">
      <div class="content">

        <!--
          R23 — THE POINT OF THIS SCREEN: the date grouping survives the
          filter. The obvious implementation flattens the matches into one
          plain list; that throws away the rhythm of the charge, which for a
          recurring payee is the thing actually worth seeing. Rows drop out,
          headers do not change, and a header with no surviving rows
          disappears with them — "Today" is gone below because this payee did
          not charge today, not because grouping was skipped.

          It also shows the half of R5 that no single row can: ONE payee,
          marked Good with a €30.00 limit, producing both verdicts. Yesterday's
          €34.21 is Bad because it exceeds the limit; the €6.40 and €4.80 are
          Good. The avatar stays green in all three — that is the payee's
          status, and no charge moves it (R8).
        -->

        <div class="section-label">Yesterday</div>

        <a class="tx-row" href="03b-debit-detail-over-limit.html">
          <div class="avatar" style="background:var(--good-bg);color:var(--good);">BM</div>
          <div class="tx-info">
            <div class="tx-name">Bäckerei Müller</div>
            <div class="tx-date">Card payment · 12:41</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount" style="color:var(--bad);">€34.21</div>
            <span class="pill pill-bad">Bad</span>
          </div>
        </a>

        <div class="section-label">August 2026</div>

        <a class="tx-row" href="03-debit-detail.html">
          <div class="avatar" style="background:var(--good-bg);color:var(--good);">BM</div>
          <div class="tx-info">
            <div class="tx-name">Bäckerei Müller</div>
            <div class="tx-date">Card payment · 1 Aug, 08:20</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount">€6.40</div>
          </div>
        </a>

        <div class="section-label">July 2026</div>

        <a class="tx-row" href="03-debit-detail.html">
          <div class="avatar" style="background:var(--good-bg);color:var(--good);">BM</div>
          <div class="tx-info">
            <div class="tx-name">Bäckerei Müller</div>
            <div class="tx-date">Card payment · 2 Jul, 08:05</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount">€4.80</div>
          </div>
        </a>

        <div style="flex:1"></div>
      </div>
    </div>
    <div class="tab-bar">
      <a class="tab-item active" aria-label="Debits" href="02-debit-list.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></a>
      <a class="tab-item" aria-label="Rules" href="04-payee-rules.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg></a>
      <a class="tab-item" aria-label="Settings" href="06-settings.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4"/><path d="M18.6 12h2M16.7 16.7l1.4 1.4M12 18.6v2M7.3 16.7l-1.4 1.4M5.4 12h-2M7.3 7.3L5.9 5.9M12 5.4v-2M16.7 7.3l1.4-1.4"/></svg></a>
    </div>
  </div>
</body>
</html>
