# Local dev Postgres for the notification tracer bullet (TRACER-02-NOTIFICATIONS.md, step 1).
# Throwaway database: the password below is dev-only and never used anywhere real. The connection
# string the backend actually reads lives in `dotnet user-secrets` (ConnectionStrings:Postgres).
services:
  postgres:
    image: postgres:16
    container_name: greedy-nose-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greedynose
      POSTGRES_PASSWORD: greedynose-dev
      POSTGRES_DB: greedynose
    ports:
      # Loopback only: the password is in the repo, and from step 6 on this holds real bank data.
      - "127.0.0.1:5432:5432"
    volumes:
      - greedy-nose-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greedynose -d greedynose"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage emulator for the Functions host (Story 2.3): the timer trigger keeps its singleton lock
  # (a blob lease) in AzureWebJobsStorage. Nothing real lives here; the account key is Azurite's
  # public well-known dev key. Only the Functions host container uses it, over the compose network.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: greedy-nose-azurite
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --location /data
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - greedy-nose-azurite:/data

volumes:
  greedy-nose-pgdata:
  greedy-nose-azurite:
